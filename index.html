<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fridge Organizer</title>
<meta name="theme-color" content="#c4552d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Fridge">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style id="app-style">
:root{--bg:#faf6f0;--card:#fff;--ink:#2b2420;--muted:#7a6e66;--line:#e9e0d5;--accent:#c4552d;--accent-soft:#f6e3d9;--ok:#3f7a3a;--ok-soft:#e3f0df;--warn:#9a6a10;--warn-soft:#fbf0d6;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:0 max(14px,env(safe-area-inset-right)) env(safe-area-inset-bottom) max(14px,env(safe-area-inset-left))}
header > div{flex-wrap:wrap}
header{padding-top:28px;display:flex;flex-wrap:wrap;gap:12px;align-items:end;justify-content:space-between}
h1{font-family:Fraunces,Georgia,serif;font-size:34px;margin:0;letter-spacing:-.5px}
h1 small{display:block;font:500 13px Inter,sans-serif;color:var(--muted);letter-spacing:0;margin-top:4px}
h2.section{font-family:Fraunces,Georgia,serif;font-size:22px;margin:8px 0 4px}
p.hint{color:var(--muted);margin:0 0 14px;font-size:14px}
nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:18px 0 18px;overflow-x:auto}
nav.tabs a{padding:10px 14px;color:var(--muted);text-decoration:none;font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
nav.tabs a:hover{color:var(--ink)}
nav.tabs a.active{color:var(--accent);border-color:var(--accent)}
.badge{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:99px;background:#efe7dd;color:var(--muted);font-size:12px;text-align:center}
nav.tabs a.active .badge{background:var(--accent-soft);color:#8a3618}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
input,select,textarea{font:inherit;color:inherit;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.toolbar input{flex:1;min-width:200px}
.toolbar select{width:auto}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:#fff;padding:9px 14px;color:var(--ink)}
button:hover{border-color:#cdbfae}
.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.primary:hover{background:#a9441f;border-color:#a9441f}
.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:6px 8px}
.ghost:hover{color:var(--ink);background:#f1ebe3}
.danger{color:#b3261e}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px;padding-bottom:30px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px}
.card.can{border:2px solid var(--ok);box-shadow:0 0 0 4px var(--ok-soft)}
.card h3{font-family:Fraunces,Georgia,serif;font-size:21px;margin:0;line-height:1.2}
.meta{display:flex;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);align-items:center}
.tag{background:var(--accent-soft);color:#8a3618;border-radius:99px;padding:2px 10px;font-weight:500}
.tag.ok{background:var(--ok);color:#fff}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.ings{list-style:none;margin:0;padding:0;border-top:1px dashed var(--line)}
.ings li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line)}
.ings li span:last-child{color:var(--muted);white-space:nowrap}
.ings li .mk{display:inline-block;width:18px;font-weight:700}
.ings li.have .mk{color:var(--ok)}
.ings li.miss .mk{color:#c9bfb4}
.ings li.miss > span:first-child{color:var(--muted)}
.missing{font-size:13.5px;background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:8px 10px}
details summary{cursor:pointer;color:var(--muted);font-size:13.5px}
details p{white-space:pre-wrap;margin:8px 0 0}
.actions{display:flex;gap:4px;margin-top:auto;padding-top:4px;flex-wrap:wrap}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:50px 0}
.status{font-size:12.5px;color:var(--muted);min-height:18px}
.status.ok{color:var(--ok)}
/* fridge */
.fridge-add{display:grid;grid-template-columns:1fr 100px 110px auto;gap:8px;margin-bottom:14px}
#fAdd{grid-template-columns:1fr 90px 100px 150px auto}
.fridge{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:30px}
.f-row{display:grid;grid-template-columns:1fr 90px 100px 150px 40px;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}
.f-row:last-child{border-bottom:0}
.f-row input{border-color:transparent;background:transparent;padding:7px 8px}
.f-row input:hover{border-color:var(--line)}
.f-row input:focus{background:#fff}
.f-head{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;background:#fbf8f4}
.f-head span{padding-left:8px}
.f-used{font-size:12px;color:var(--ok)}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(43,36,32,.45);display:none;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto;z-index:10}
.overlay.open{display:flex}
.dialog{background:#fff;border-radius:18px;width:100%;max-width:640px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.dialog h3{font-family:Fraunces,Georgia,serif;font-size:22px;margin:0 0 14px}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:10px 0 4px}
.ing-row{display:grid;grid-template-columns:1fr 90px 90px 34px;gap:6px;margin-bottom:6px}
.ing-row button{padding:0}
.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.small-dialog{max-width:380px}
.view{display:none}.view.on{display:block}
/* week */
.week{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-bottom:26px}
.day{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 14px 6px}
.day.today{border:2px solid var(--accent)}
.day h3 .tag{font:500 12px Inter,sans-serif}
.day h3{font-family:Fraunces,Georgia,serif;font-size:19px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
.slot{padding:8px 0;border-top:1px dashed var(--line)}
.slot .lbl{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
.slot select{padding:7px 10px}
.slot .st{font-size:12.5px;margin-top:4px}
.st.ok{color:var(--ok)}.st.warn{color:var(--warn)}
.shop{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:30px}
.shop ul{margin:8px 0 12px;padding-left:20px}
.shop li{padding:2px 0}
.shop li small{color:var(--muted)}
/* accordion */
.acc-tools{display:flex;justify-content:flex-end;gap:4px;margin:-4px 0 6px}
details.cu{background:#fff;border:1px solid var(--line);border-radius:16px;margin-bottom:14px;overflow:hidden}
details.cu > summary{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;cursor:pointer;list-style:none}
details > summary::-webkit-details-marker{display:none}
details.cu > summary .cu-title{font-family:Fraunces,Georgia,serif;font-size:22px;font-weight:700}
details.cu > summary::before,details.ty > summary::before,details.rc > summary::before{content:'▸';color:var(--muted);transition:transform .15s;display:inline-block;flex:none}
details.cu[open] > summary::before,details.ty[open] > summary::before,details.rc[open] > summary::before{transform:rotate(90deg)}
details.cu > summary .cu-title{flex:1}
details.cu > summary,details.ty > summary,details.rc > summary{color:var(--ink);font-size:15px}
.cnt{font:500 13px Inter,sans-serif;color:var(--muted);margin-left:6px}
.okc{color:var(--ok)}
.cu-body{padding:0 14px 14px}
details.ty{border:1px solid var(--line);border-radius:12px;margin-top:10px;background:#fcfaf7}
details.ty > summary{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;list-style:none;font-weight:600}
details.ty > summary > span:first-of-type{flex:1}
.ty-body{padding:0 10px 10px}
details.rc{background:#fff;border:1px solid var(--line);border-radius:10px;margin-top:6px}
details.rc.can{border-color:var(--ok)}
details.rc > summary{display:flex;align-items:center;gap:10px;padding:9px 12px;cursor:pointer;list-style:none;flex-wrap:wrap}
details.rc > summary:hover,details.ty > summary:hover{background:#f6f0e8}
.rc-name{flex:1;font-weight:600;min-width:160px}
.rc-meta{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.rc-body{padding:4px 14px 12px;border-top:1px dashed var(--line)}
.rc-cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:8px}
.rc-body h4{margin:6px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
.steps{white-space:pre-wrap;margin:0;font-size:14px}
@media (max-width:700px){.rc-cols{grid-template-columns:1fr}}
.ghost-link{display:inline-flex;align-items:center;padding:6px 8px;border-radius:10px;color:var(--muted);text-decoration:none;font-size:15px}
.ghost-link.strong{color:var(--accent);font-weight:600}
.sources{font-size:13px;color:var(--muted);margin:0 4px 4px;line-height:1.7}
.sources a{color:var(--muted)}
.sources a:hover{color:var(--accent)}
.ghost-link:hover{color:var(--ink);background:#f1ebe3}
.ph{overflow:hidden;flex:none;display:flex;align-items:center;justify-content:center}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph-ill span{line-height:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.12))}
.ph-thumb{width:44px;height:44px;border-radius:9px}
.ph-thumb.ph-ill span{font-size:24px}
.ph-big{width:100%;height:170px;border-radius:12px;margin:6px 0 4px}
.ph-big.ph-ill span{font-size:72px}
.ph-cover{margin:-18px -18px 4px;height:170px;border-radius:15px 15px 0 0}
.ph-cover.ph-ill span{font-size:76px}
.card.can .ph-cover{border-radius:14px 14px 0 0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.chip{border-radius:99px;padding:7px 14px;font-weight:500}
.chip span{color:var(--muted);font-size:12px;margin-left:2px}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.on span{color:#d9cfc4}
.cuisine-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:14px 0 10px}
.tag.cui{background:#efe7dd;color:var(--ink)}
.tag.tm{background:#e3f4ea;color:#0b7a3e;font-weight:600}
.tag.hit{background:#fde3d3;color:#b23c0b;font-weight:600}
.tag.rate{background:#fff4cc;color:#7a5a00;font-weight:600}
.cooked{font-size:12.5px;color:var(--muted);margin:4px 0 0}
.stars{display:flex;gap:4px}
.stars button{font-size:26px;line-height:1;padding:4px 6px;border:0;background:transparent;color:#d8cbbb}
.stars button.on{color:#e0a100}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border-radius:99px;padding:7px 14px}
.seg button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.wk-done{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.wk-done button,.wk-cook{font-size:12.5px;padding:4px 10px;margin-top:6px}
.wk-done button{margin-top:0}
.cu-btns{display:flex;gap:6px;align-items:center}
.servctl{display:inline-flex;align-items:center;gap:2px;margin-left:6px;font:500 12.5px Inter,sans-serif;color:var(--ink);text-transform:none;letter-spacing:0;vertical-align:middle}
.servctl button{padding:0 8px;line-height:22px;border-radius:99px;font-weight:700}
.servctl span{padding:0 4px}
.ings-head{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
.exp-bad{color:#b3261e;font-weight:600}.exp-soon{color:#c76a00;font-weight:600}.exp-ok{color:var(--muted)}
.f-row.exp-row-bad{background:#fdecea}.f-row.exp-row-soon{background:#fff4e0}
.f-exp-lbl{font-size:12px;padding-left:8px}
.badge.warn{background:#fde3c8;color:#a35200}
.usefirst{background:#fff7ea;border:1px solid #f3d9ad;border-radius:16px;padding:14px 18px;margin-bottom:22px}
.usefirst h2{margin-top:0}
.usefirst .chips{margin:6px 0 4px}
.uf-list{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.uf-item{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.uf-item strong{flex:1;min-width:160px}
.uf-item small{color:var(--muted)}
.shop-sec{font-size:13px;font-weight:600;color:var(--muted);padding:10px 14px 6px;background:#fbf8f4;border-bottom:1px solid var(--line);letter-spacing:.2px}
.s-have{color:var(--ok);font-size:12px}
.slot .lbl{display:flex;justify-content:space-between;align-items:center;gap:6px}
.slot-tools{display:flex;gap:4px;align-items:center;text-transform:none;letter-spacing:0;font-weight:500}
.slot-tools input{width:52px;padding:2px 6px;font-size:12.5px}
.slot-tools button{padding:2px 7px;font-size:13px;line-height:1.4}
.use-row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 0;border-bottom:1px dashed var(--line)}
.use-row small{color:var(--muted);font-weight:400}
.use-left{font-size:13px;color:var(--muted);white-space:nowrap}
.use-left input{width:64px;padding:4px 6px;display:inline-block}
.bk-actions{display:flex;flex-direction:column;gap:8px;margin-top:6px}
body.cm-lock{overflow:hidden}
#cmOverlay{background:#fbf7f0;padding:0;align-items:stretch;z-index:30}
.cm{display:flex;flex-direction:column;width:100%;max-width:900px;margin:0 auto;min-height:100%;padding:14px 18px 18px}
.cm-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cm-top h3{flex:1;font-family:Fraunces,Georgia,serif;font-size:20px;margin:0;min-width:160px}
.cm-count{font-size:13px;color:var(--muted);font-weight:600}
.cm-progress{height:5px;background:#eadfce;border-radius:99px;margin:10px 0 6px;overflow:hidden}
.cm-progress div{height:100%;background:var(--accent);transition:width .25s}
.cm-dots{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.cm-dots button{width:14px;height:14px;padding:0;border-radius:99px;background:#e9dccb;border:0}
.cm-dots button.on{background:var(--accent);transform:scale(1.25)}
.cm-dots button.bm{box-shadow:0 0 0 2px #2c3e6b}
.cm-resume{background:#e6ebf7;color:#2c3e6b;border-radius:10px;padding:8px 12px;font-size:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:4px 0}
.cm-resume button{padding:3px 10px;font-size:13px}
.cm-stepwrap{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:240px}
.cm-step{font-size:27px;line-height:1.45;white-space:pre-wrap;margin:14px 0;background:#fffdf7;border:1px solid #efe4d3;border-left:4px double #e8a99a;border-radius:12px;padding:22px 24px}
.cm-step.own{font-family:Caveat,'Segoe Print','Bradley Hand',cursive;font-size:34px;color:#2c3e6b}
.cm-step mark{background:#fde7c4;color:inherit;border-radius:5px;padding:0 3px}
.cm-timers{display:flex;gap:8px;flex-wrap:wrap}
.cm-timers button{border-radius:99px;font-weight:600;color:#8a3618;background:var(--accent-soft);border-color:#efc9b6}
.cm-next{color:var(--muted);font-size:15px;margin:14px 0 4px;padding:10px 14px;border:1px dashed var(--line);border-radius:10px;background:#fff}
.cm-next span{font-weight:600;color:var(--ink)}
.cm-nav{display:flex;gap:10px;margin-top:12px}
.cm-nav button{flex:1;padding:16px;font-size:18px;font-weight:600;border-radius:14px}
.cm-nav .primary{flex:2}
#cmMark.on{background:#e6ebf7;border-color:#b9c6e6;color:#2c3e6b}
.cm-clock{font:700 18px Inter,sans-serif;background:var(--ink);color:#fff;border-radius:99px;padding:4px 6px 4px 14px;display:flex;align-items:center;gap:6px}
.cm-clock button{background:transparent;border:0;color:#fff;padding:2px 8px}
.cm-clock.ring{background:#b3261e;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.cm-ings{display:none;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-top:8px;max-height:45vh;overflow:auto}
.cm-ings.open{display:block}
.cm-ings h4{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
@media (max-width:560px){.cm-step{font-size:22px;padding:16px}.cm-step.own{font-size:28px}.cm-nav button{padding:14px 8px;font-size:16px}}
.paper{background-color:#fffdf7;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 25px,#ecdfcc 25px,#ecdfcc 26px);background-position:0 6px;line-height:26px;border:1px solid #efe4d3;border-left:3px double #e8a99a;border-radius:8px;padding:6px 12px 8px 16px;white-space:pre-wrap;margin:8px 0 0;font-size:14px;color:var(--ink)}
.paper.editable{cursor:text}
.paper.editable:hover{border-color:#e2cfb6}
.paper.own{font-family:Caveat,'Segoe Print','Bradley Hand',cursive;font-size:21px;color:#2c3e6b}
.paper.empty-steps{color:var(--muted);font-style:italic}
textarea.paper{display:block;width:100%;resize:vertical;min-height:180px;font-family:Caveat,'Segoe Print','Bradley Hand',cursive;font-size:21px;color:#2c3e6b;outline:none}
textarea.paper:focus{border-color:var(--accent);border-left-color:#e8a99a}
.steps-foot{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:4px;font-size:12.5px;color:var(--muted)}
.steps-foot .ghost{font-size:12.5px;padding:4px 8px}
.tag.own{background:#e6ebf7;color:#2c3e6b;font-weight:600}
.chip.add-chip{border-style:dashed;color:var(--muted)}
.drop.drag-over{outline:2px dashed var(--accent);outline-offset:-2px;background:var(--accent-soft)}
details.rc.dragging{opacity:.45}
details.rc > summary[draggable="true"]{cursor:grab}
.sub-row{display:grid;grid-template-columns:1fr 34px 34px auto;gap:4px;margin-bottom:6px;align-items:center}
.sub-row button{padding:6px 8px}
.sub-row.armed button.danger{color:#fff;background:#b3261e;border-radius:8px}
.icon-in{width:70px !important;text-align:center;font-size:20px}
.del-box{margin-top:14px;padding:12px;border:1px solid #f0c9c4;background:#fdf1ef;border-radius:12px}
.chip.tm-chip{border-color:#0b7a3e;color:#0b7a3e}
.chip.tm-chip.on{background:#0b7a3e;border-color:#0b7a3e;color:#fff}
.check{display:flex;align-items:center;gap:8px;margin:12px 0 0;font-size:14px;font-weight:500;color:var(--ink)}
.check input{width:auto}
.ghost.plan{color:var(--accent);font-weight:600}
.shop-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:6px 0 10px}
.s-row{display:grid;grid-template-columns:1fr 40px;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.s-row:last-child{border-bottom:0}
.s-check{display:flex;gap:12px;align-items:flex-start;cursor:pointer;margin:0;font-size:15px;font-weight:400;color:var(--ink)}
.s-check input{width:20px;height:20px;margin-top:2px;accent-color:var(--ok);flex:none}
.s-check small{display:block;color:var(--muted);font-size:12.5px}
.s-amt{color:var(--muted)}
.s-row.done strong{text-decoration:line-through;color:var(--muted)}

  function resizeImage(file, max){
    return new Promise(function(resolve){
      if (!/^image\/(jpeg|png|webp)/.test(file.type)) { resolve(file); return; }
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function(){
        var sc = Math.min(1, max / Math.max(img.width, img.height));
        var c = document.createElement('canvas'); c.width = Math.round(img.width*sc); c.height = Math.round(img.height*sc);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        c.toBlob(function(b){ resolve(b || file); }, 'image/jpeg', 0.85);
      };
      img.onerror = function(){ URL.revokeObjectURL(url); resolve(file); };
      img.src = url;
    });
  }

      CUISINES.map(function(c){ return '<option'+(c===filter.cui?' selected':'')+'>'+esc(c)+'</option>'; }).join('');
    $('catList').innerHTML = cats.map(function(c){ return '<option value="'+esc(c)+'">'; }).join('');
    var q = filter.q.trim().toLowerCase();
    var items = state.recipes.filter(function(r){
      if (filter.cat && r.category !== filter.cat) return false;
      if (filter.cui && (r.cuisine||'') !== filter.cui) return false;
      if (!q) return true;
      if ((r.name||'').toLowerCase().indexOf(q) >= 0) return true;
      return (r.ingredients||[]).some(function(i){ return (i.name||'').toLowerCase().indexOf(q) >= 0; });
    }).sort(byName);
    var srt = filter.sort || '';
    if (srt === 'h') items = items.filter(function(r){ return HITS[r.id]; });
    function by(fn, asc){ items.sort(function(a,b){ var x = fn(a), y = fn(b); var nx = x == null, ny = y == null; if (nx || ny) return nx - ny; return asc ? x - y : y - x; }); }
    if (srt === 'n' || srt === 'h') by(function(r){ var s = stats(r); return s.n ? s.n + s.taste/10 : null; });
    else if (srt === 's') by(function(r){ var s = stats(r); return s.tasteN ? s.taste + s.n/1000 : null; });
    else if (srt === 'e') by(function(r){ var s = stats(r); return s.diff ? s.diff + realTime(r)/100000 : null; }, true);
    else if (srt === 't') by(function(r){ return realTime(r) || null; }, true);
    else if (srt === 'o') by(function(r){ var s = stats(r); return s.n ? Date.parse(s.last) : null; }, true);

  // ---------- pomysł na… (katalog: sekcje i podkategorie) ----------
  var CK = '__cookidoo';
  var HIT = '__hity';
  var NONE = '__none';
  // catalog = [{id, name, icon, subs:[nazwy]}] – kolejność = kolejność wyświetlania
  function initCatalog(){
    var fresh = !Array.isArray(state.catalog);
    if (fresh){
      state.catalog = [];
      if (state.recipes.some(function(r){ return r.cookidooList; }))
        state.catalog.push({id: CK, name: 'Thermomix – moje listy z Cookidoo', icon: '📗', subs: []});
      CUISINES.forEach(function(c){ state.catalog.push({id: c, name: c, icon: CUISINE_ICON[c], subs: []}); });
    }
    state.recipes.forEach(function(r){
      if (!r.sec){
        r.sec = r.cookidooList && findSec(CK) ? CK : (CUISINES.indexOf(r.cuisine) >= 0 && findSec(r.cuisine) ? r.cuisine : NONE);
        r.sub = r.cookidooList && r.sec === CK ? r.cookidooList : dishTypeOf(r);
      }
      if (!r.sub) r.sub = 'Inne';
      var s = findSec(r.sec);
      if (s && s.subs.indexOf(r.sub) < 0) s.subs.push(r.sub);
    });
    if (fresh) state.catalog.forEach(function(s){
      s.subs.sort(function(a,b){
        var ia = DISH_TYPES.indexOf(a), ib = DISH_TYPES.indexOf(b);
        if (ia >= 0 && ib >= 0) return ia - ib;
        if (ia >= 0 || ib >= 0) return ia >= 0 ? -1 : 1;
        return a.localeCompare(b, 'pl');
      });
    });
  }
  function findSec(id){ return (state.catalog||[]).find(function(s){ return s.id === id; }); }
  function secOf(r){ return findSec(r.sec) ? r.sec : NONE; }
  function subIcon(t){ return DISH_ICON[t] || '📋'; }
  function placeRecipe(r, secId, sub){
    var s = findSec(secId);
    if (!s){ r.sec = NONE; r.sub = sub || 'Inne'; return; }
    sub = (sub || '').trim() || (s.subs[0] || 'Inne');
    if (s.subs.indexOf(sub) < 0) s.subs.push(sub);
    r.sec = secId; r.sub = sub;
  }

  function subBlock(secId, sub, list){
    var tkey = 'ty:' + secId + ':' + sub;
    var canN = list.filter(function(r){ return analyze(r).can; }).length;
    return '<details class="ty" data-key="'+esc(tkey)+'"'+(isOpen(tkey,false)?' open':'')+'>' +
      '<summary class="drop" data-dsec="'+esc(secId)+'" data-dsub="'+esc(sub)+'"><span>'+subIcon(sub)+' '+esc(sub)+'</span><span class="cnt">'+list.length+(canN?' · <span class="okc">'+canN+' możesz zrobić</span>':'')+'</span></summary>' +
      '<div class="ty-body">' + (list.length ? list.map(recipeRow).join('') : '<p class="hint" style="margin:6px 4px">Pusto. Przeciągnij tu przepis albo użyj przycisku „📂 Przenieś” przy przepisie.</p>') + '</div></details>';
  }
  function sectionBlock(s, recs){
    var id = s ? s.id : NONE;
    var key = 'cu:' + id;
    var subs = s ? s.subs.slice() : [];
    recs.forEach(function(r){ if (subs.indexOf(r.sub) < 0) subs.push(r.sub); });
    var inner = subs.map(function(t){ return subBlock(id, t, recs.filter(function(r){ return r.sub === t; }).sort(byName)); }).join('');
    if (!subs.length) inner = '<div class="empty" style="padding:20px 0">Ta sekcja jest pusta. Dodaj przepis, przenieś istniejący albo dodaj podkategorie (✏️).</div>';
    var src = '';
    if (s && s.id === CK) src = '<p class="sources">Przepisy z Twoich list w <a href="https://cookidoo.pl/organize/pl-PL/my-recipes" target="_blank" rel="noopener noreferrer">Cookidoo</a>. Szczegółowe ustawienia znajdziesz po kliknięciu „Pełny przepis”.</p>';
    return '<details class="cu" data-key="'+esc(key)+'"'+(isOpen(key, !!recs.length)?' open':'')+'>' +
      '<summary class="drop" data-dsec="'+esc(id)+'"><span class="cu-title">'+(s ? esc(s.icon||'📁')+' '+esc(s.name) : '📥 Bez sekcji')+' <span class="cnt">'+recs.length+'</span></span>' +
      (!readOnly ? '<span class="cu-btns">' + (s ? '<button type="button" class="ghost" data-secedit="'+esc(id)+'" title="Edytuj sekcję i podkategorie">✏️ Edytuj</button>' : '') +
        (s ? '<button type="button" data-addsec="'+esc(id)+'">+ Dodaj przepis</button>' : '') + '</span>' : '') + '</summary>' +
      '<div class="cu-body">' + src + inner + '</div></details>';
  }
  function renderPomysl(){

      '<button type="button" class="ghost" data-accall="1">Rozwiń wszystko</button><button type="button" class="ghost" data-accall="0">Zwiń wszystko</button></div>' +

        return sectionBlock(id === NONE ? null : findSec(id), bySec[id] || []);

  // ---------- okno: sekcja (nowa / edycja) ----------
  var secEditing = null;
  function secSubRow(name){

    d.innerHTML = '<input class="subName" maxlength="60" placeholder="Nazwa podkategorii" value="'+esc(name||'')+'">' +

  $('secSubs').addEventListener('click', function(e){
    var b = e.target.closest('button[data-sm]'); if (!b) return;
    var row = b.parentNode, act = b.getAttribute('data-sm');
    if (act === 'up' && row.previousElementSibling) row.parentNode.insertBefore(row, row.previousElementSibling);
    else if (act === 'down' && row.nextElementSibling) row.parentNode.insertBefore(row.nextElementSibling, row);
    else if (act === 'del'){
      var orig = row.getAttribute('data-orig'), n = 0;
      if (orig && secEditing) n = state.recipes.filter(function(r){ return r.sec === secEditing && r.sub === orig; }).length;
      if (n && !row.classList.contains('armed')){ row.classList.add('armed'); b.textContent = 'Usuń? ('+n+' → „Inne”)'; setTimeout(function(){ if (row.parentNode){ row.classList.remove('armed'); b.textContent = '✕'; } }, 3000); return; }

  $('secAddSub').onclick = function(){ var r = secSubRow(''); $('secSubs').appendChild(r); r.querySelector('input').focus(); };
  $('secUp').onclick = function(){ moveSec(-1); };

  function moveSec(dir){
    var i = state.catalog.findIndex(function(s){ return s.id === secEditing; }), j = i + dir;

  });

  // ---------- ugotowane ----------
  var cookCtx = null;
  function setStars(n){ cookCtx.s = n; Array.prototype.forEach.call($('cookStars').children, function(b){ b.classList.toggle('on', +b.getAttribute('data-star') <= n); }); }
  function setDiff(n){ cookCtx.df = n; Array.prototype.forEach.call($('cookDiff').children, function(b){ b.classList.toggle('on', +b.getAttribute('data-df') === n); }); }
  function openCook(id, wk){
    var r = findRecipe(id); if (!r) return;
    cookCtx = {id: id, wk: wk, s: 0, df: 0};
    $('cookName').textContent = r.name;
    setStars(0); setDiff(0); $('cookMin').value = '';
    var st = stats(r);
    $('cookMin').placeholder = r.time ? 'wg przepisu: ' + r.time : 'np. 45';
    $('cookServ').value = (wk && state.weekServ[wk]) || curServ(r) || '';
    renderCookFridge();
    $('cookHint').textContent = st.n ? 'Dotąd: ugotowane ' + st.n + '×' + (st.mins ? ', średni realny czas ~' + st.mins + ' min' : '') + (st.tasteN ? ', średnia ocena ' + fmt1(st.taste) : '') + '.' : 'Pierwsze ugotowanie tego dania.';
    $('cookOverlay').classList.add('open');
  }
  function saveCook(withRating){
    var r = findRecipe(cookCtx.id); if (!r) return;
    var e = {id: uid('c'), d: todayStr()};
    if (withRating){
      if (cookCtx.s) e.s = cookCtx.s;
      if (cookCtx.df) e.df = cookCtx.df;
      var m = parseInt($('cookMin').value, 10); if (m > 0) e.m = m;
    }
    var fu = applyCookFridge(); if (fu.length) e.fu = fu;
    var sv = parseInt($('cookServ').value, 10); if (sv && sv !== baseServ(r)) e.p = sv;
    if (!Array.isArray(r.log)) r.log = [];
    r.log.push(e);
    if (cookCtx.wk) state.weekDone[cookCtx.wk] = {r: r.id, e: e.id};
    $('cookOverlay').classList.remove('open');
    render(); scheduleSave(); toast('Zapisano: ' + r.name + ' – ugotowane ' + r.log.length + '×');
  }
  $('cookStars').addEventListener('click', function(e){ var b = e.target.closest('button[data-star]'); if (b) setStars(+b.getAttribute('data-star')); });
  $('cookDiff').addEventListener('click', function(e){ var b = e.target.closest('button[data-df]'); if (b) setDiff(+b.getAttribute('data-df')); });
  $('cookCancel').onclick = function(){ $('cookOverlay').classList.remove('open'); };
  $('cookSkip').onclick = function(){ saveCook(false); };
  $('cookServ').addEventListener('input', renderCookFridge);
  $('cookForm').addEventListener('submit', function(e){ e.preventDefault(); saveCook(true); });

  // ---------- week actions ----------
  $('week').addEventListener('change', function(e){
    var inp = e.target.closest('input[data-wserv]'); if (!inp) return;
    var k = inp.getAttribute('data-wserv'), p = k.split('|'), r = findRecipe(state.week[p[0]] && state.week[p[0]][p[1]]);
    var v = parseInt(inp.value, 10);
    if (!v || !r || v === baseServ(r)) delete state.weekServ[k]; else state.weekServ[k] = Math.min(60, v);
    render(); scheduleSave();
  });
  $('week').addEventListener('click', function(e){
    var rb = e.target.closest('button[data-wroll]');
    if (rb){
      var k = rb.getAttribute('data-wroll'), p = k.split('|'), cur = state.week[p[0]] && state.week[p[0]][p[1]];
      var used = usedInWeek(); delete used[cur];
      var r = suggestFor(p[1], used, cur); if (!r){ toast('Brak innych pasujących dań'); return; }
      if (!state.week[p[0]]) state.week[p[0]] = {};
      state.week[p[0]][p[1]] = r.id; delete state.weekDone[k]; delete state.weekServ[k];
      render(); scheduleSave(); toast('🎲 ' + r.name); return;
    }
    var b = e.target.closest('button[data-wkdone]');
    if (b){ openCook(b.getAttribute('data-id'), b.getAttribute('data-wkdone')); return; }
    var u = e.target.closest('button[data-wkundo]');
    if (u){
      var k = u.getAttribute('data-wkundo'), wd = state.weekDone[k];
      if (wd){ var r = findRecipe(wd.r);
        var en = r && Array.isArray(r.log) ? r.log.find(function(x){ return x.id === wd.e; }) : null;
        if (en && Array.isArray(en.fu)) en.fu.forEach(function(old){ var i = state.fridge.findIndex(function(x){ return x.id === old.id; }); if (i >= 0) state.fridge[i] = old; else state.fridge.push(old); });
        if (r && Array.isArray(r.log)) r.log = r.log.filter(function(x){ return x.id !== wd.e; }); if (r && r.log && !r.log.length) delete r.log; }
      delete state.weekDone[k]; render(); scheduleSave();
    }
  });
  $('week').addEventListener('change', function(e){
    var sel = e.target.closest('select[data-day]'); if (!sel) return;
    var d = sel.getAttribute('data-day'), m = sel.getAttribute('data-meal');
    if (!state.week[d]) state.week[d] = {};
    if (sel.value) state.week[d][m] = sel.value; else delete state.week[d][m];
    delete state.weekDone[d+'|'+m]; delete state.weekServ[d+'|'+m];
    if (!Object.keys(state.week[d]).length) delete state.week[d];
    render(); scheduleSave();
  });
  var clearArmed = false;
  $('clearWeek').addEventListener('click', function(){
    var b = $('clearWeek');
    if (!clearArmed){ clearArmed = true; b.textContent = 'Kliknij ponownie, aby wyczyścić'; b.classList.add('danger');
      setTimeout(function(){ clearArmed = false; b.textContent = 'Wyczyść tydzień'; b.classList.remove('danger'); }, 3000); return; }
    clearArmed = false; b.textContent = 'Wyczyść tydzień'; b.classList.remove('danger');
    state.week = {}; state.weekDone = {}; state.weekServ = {}; render(); scheduleSave();
  });
  // ---------- pomysł / plan / zakupy actions ----------
  $('cuisineChips').addEventListener('click', function(e){
    if (e.target.closest('button[data-newsec]')) { openSec(null); return; }
    var b = e.target.closest('button[data-cf]'); if (!b) return;
    cuisineFilter = b.getAttribute('data-cf'); renderPomysl();
  });
  $('pomysl').addEventListener('click', function(e){
    var b = e.target.closest('button[data-addsec]');
    if (b){ e.preventDefault(); openEdit(null, b.getAttribute('data-addsec')); return; }
    var se = e.target.closest('button[data-secedit]');
    if (se){ e.preventDefault(); openSec(se.getAttribute('data-secedit')); return; }
    var all = e.target.closest('button[data-accall]');
    if (all){
      var open = all.getAttribute('data-accall') === '1';
      Array.prototype.forEach.call($('pomysl').querySelectorAll(open ? 'details.cu, details.ty' : 'details'), function(d){
        d.open = open; openKeys[d.getAttribute('data-key')] = open;
      });
      rememberOpen();
    }
  });
  $('pomysl').addEventListener('toggle', function(e){
    var d = e.target; if (!d.getAttribute || !d.getAttribute('data-key')) return;
    openKeys[d.getAttribute('data-key')] = d.open; rememberOpen();
  }, true);
  $('pDay').addEventListener('change', planWarn);
  $('pMeal').addEventListener('change', planWarn);
  $('planNo').onclick = function(){ $('planOverlay').classList.remove('open'); };
  $('planForm').addEventListener('submit', function(e){
    e.preventDefault();
    var d = $('pDay').value, m = $('pMeal').value;
    if (!state.week[d]) state.week[d] = {};
    state.week[d][m] = planId;
    $('planOverlay').classList.remove('open');
    render(); scheduleSave(); toast('Dodano: ' + DAYS[d] + ' – ' + m.toLowerCase());
  });
  $('sAdd').addEventListener('submit', function(e){
    e.preventDefault();
    var name = $('saName').value.trim(); if (!name) return;
    state.shopExtra.push({id: uid('s'), name: name, qty: $('saQty').value.trim(), unit: $('saUnit').value.trim()});
    $('saName').value = ''; $('saQty').value = ''; $('saUnit').value = '';
    render(); scheduleSave(); $('saName').focus();
  });
  $('shopList').addEventListener('change', function(e){
    var c = e.target.closest('input[data-skey]'); if (!c) return;
    var k = c.getAttribute('data-skey');
    if (c.checked) state.shopDone[k] = true; else delete state.shopDone[k];
    render(); scheduleSave();
  });
  $('shopList').addEventListener('click', function(e){
    var del = e.target.closest('button[data-sdel]');
    if (del){
      var k = del.getAttribute('data-sdel');
      state.shopExtra = state.shopExtra.filter(function(x){ return keyOf(x.name) !== k; });
      delete state.shopDone[k];
      render(); scheduleSave(); return;
    }
    if (e.target.closest('#copyShop')){
      var b = e.target.closest('#copyShop');
      var lst = bySection(shopItems().filter(function(x){ return !x.done; })), txt = 'Lista zakupów:';
      lst.forEach(function(it, k){ if (k === 0 || lst[k-1].section !== it.section) txt += '\n\n' + it.section; txt += '\n- ' + it.name + (it.amounts.length ? ' — ' + it.amounts.join(' + ') : ''); });
      copyText(b, txt);
      return;
    }
    if (e.target.closest('#toFridge')){
      var bought = shopItems().filter(function(x){ return x.done; });
      bought.forEach(function(it){
        if (!state.fridge.some(function(f){ return f.name.toLowerCase() === it.name.toLowerCase(); })){
          var single = it.amounts.length === 1 ? it.amounts[0] : '';
          var m = single.match(/^(\S+)\s*(.*)$/);
          state.fridge.push({id: uid('f'), name: it.name, qty: m ? m[1] : '', unit: m ? m[2] : ''});
        }
        state.shopExtra = state.shopExtra.filter(function(x){ return keyOf(x.name) !== it.key; });
        delete state.shopDone[it.key];
      });
      render(); scheduleSave(); toast('Przeniesiono do lodówki: ' + bought.length);
    }
  });
  function toast(t){
    var el = $('toast'); el.textContent = t; el.classList.add('on');
    clearTimeout(toast._t); toast._t = setTimeout(function(){ el.classList.remove('on'); }, 2200);
  }

  document.addEventListener('keydown', function(e){ if (e.key==='Escape'){ closeEdit(); ['delOverlay','planOverlay','cookOverlay','moveOverlay','secOverlay','bkOverlay','awOverlay'].forEach(function(o){ $(o).classList.remove('open'); }); } });
  [$('editOverlay'),$('delOverlay'),$('planOverlay'),$('cookOverlay'),$('moveOverlay'),$('secOverlay'),$('bkOverlay'),$('awOverlay'),$('hhOverlay')].filter(function(o){ return o.id !== 'hhOverlay' || SYNC.code; }).forEach(function(o){ o.addEventListener('mousedown', function(e){ if (e.target===o) o.classList.remove('open'); }); });

  showView();
  render();

  if (!SYNC.code) openHome();
  else { if (SYNC.dirty) push(0); else pull(); loadPhotos(); }
  if (navigator.onLine === false) offlineStatus();
  try { var pv = localStorage.getItem('fo-app-version'); if (pv && pv !== FO.version) setTimeout(function(){ toast('Zaktualizowano aplikację ✓'); }, 800); localStorage.setItem('fo-app-version', FO.version); } catch(e){}
  if ('serviceWorker' in navigator && location.protocol === 'https:'){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
})();
</script>
</body>
</html>
